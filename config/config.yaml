app:
  app_level: ${APP_LEVEL}
  time_zone: ${TIME_ZONE}
db:
  dsn: postgresql://${DB_USER}:${DB_PASSWORD}@${DB_HOST}:${DB_PORT}/${DB_NAME}
  pool_size: 5
  pool_overflow_size: ${DB_POOL_OVERFLOW_SIZE}
  pool_timeout: ${DB_TIMEOUT}
llm:
  prompt_label: ${PROMPT_LABEL}
  embedding_model: text-embedding-3-small
