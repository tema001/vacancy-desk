name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint-mypy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
      - run: uv sync --group dev --group http-service --group worker
      - run: uv run ruff check src
      - run: uv run ruff format --check src
      - run: uv run mypy src

  test:
    needs: lint-mypy
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: pass
          POSTGRES_DB: jobs_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U user -d jobs_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_HOST: localhost
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
      - run: uv sync --group dev --group worker
      - run: uv run --env-file config/test.env alembic upgrade head
      - run: uv run --env-file config/test.env pytest