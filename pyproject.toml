[project]
name = "vacancy-desk"
version = "0.1.0"
description = "hiiii"
readme = "README.md"
authors = [
    { name = "Artem Shutilo", email = "shutilo.a@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "asyncpg>=0.31.0",
    "envyaml>=1.10.211231",
    "fastapi>=0.141.1",
    "feedparser>=6.0.14",
    "httpx2>=2.12.0",
    "langfuse>=4.15.2",
    "openai>=3.12.0",
    "parsel>=1.11.0",
    "pgvector>=0.5.0",
    "procrastinate>=3.9.0",
    "psycopg[binary]>=3.3.5",
    "sqlalchemy[asyncio]>=2.0.52",
    "uvicorn>=0.52.4",
    "watchfiles>=1.2.0",
]

[dependency-groups]
dev = [
    "alembic>=1.19.2",
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.2",
]

[tool.ruff]
target-version = "py313"
line-length = 90
src = ["src"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # bugbear
    "SIM",  # simplify
    "ASYNC",# async pitfalls
    "S",    # bandit (security)
    "RUF",  # ruff-specific
]
ignore = [
    "S101",  # assert в тестах ок
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S"]

[tool.ruff.format]
quote-style = "single"

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
show_error_codes = true
warn_unused_ignores = true
pretty = true

[[tool.mypy.overrides]]
module = [
    "fastapi.*",
    "uvicorn.*",
    "geonamescache",
    "geonamescache.*",
    "langfuse",
    "langfuse.*",
    "envyaml",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"

testpaths = [
    "tests"
]
